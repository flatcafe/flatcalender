<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - ようこそ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 h-screen flex flex-col justify-center items-center p-6">
  <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl">
    <h1 class="text-2xl font-bold text-amber-800 mb-6 text-center">☕ふらっとCafeへようこそ</h1>
    
    <input type="text" id="username" placeholder="お名前を入力" class="w-full p-3 border-2 border-amber-200 rounded-xl mb-6 focus:border-amber-500 outline-none">
    
    <p class="text-sm text-gray-500 mb-4">キャラを選択</p>
    <div class="grid grid-cols-4 gap-2 mb-8">
      <button class="char-btn text-4xl p-3 bg-amber-100 rounded-xl" data-char="🌻">🌻</button>
      <button class="char-btn text-4xl p-3 bg-amber-100 rounded-xl" data-char="🍃">🍃</button>
      <button class="char-btn text-4xl p-3 bg-amber-100 rounded-xl" data-char="🌸">🌸</button>
      <button class="char-btn text-4xl p-3 bg-amber-100 rounded-xl" data-char="💎">💎</button>
    </div>

    <button id="enterBtn" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition">入店する</button>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
