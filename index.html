<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>☕ふらっとCafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body class="bg-amber-50 h-screen flex flex-col font-sans text-gray-800 overflow-hidden">
  
  <main id="home" class="flex-1 relative overflow-hidden flex flex-col justify-center items-center">
    <div class="absolute inset-0 bg-[#e6d5c3] z-0"></div>
    
    <div class="relative z-10 w-full max-w-md p-4 h-full flex flex-col justify-center">
      <div class="grid grid-cols-2 gap-y-8 gap-x-2">
        
        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-white px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">今日はお休み！</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">🌻</div>
        </div>

        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-white px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">日勤だから返信遅いかも！</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">🍃</div>
        </div>

        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-white px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">夜勤だよ～</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">🌸</div>
        </div>

        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-white px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">コラボ準備中！</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">💎</div>
        </div>
        
      </div>
    </div>
  </main>

  <nav class="bg-white border-t border-gray-200 flex justify-between items-center px-4 py-2 z-20 font-nunito shrink-0">
    <button class="flex flex-col items-center w-14">
      <img src="images/today.png" alt="Today" class="w-12 h-12 object-contain">
      <span class="text-[12px] font-bold text-gray-600">Today</span>
    </button>
    
    <button class="flex flex-col items-center w-14">
      <img src="images/calender.png" alt="Calender" class="w-12 h-12 object-contain">
      <span class="text-[12px] font-bold text-gray-600">Calender</span>
    </button>
    
    <button class="flex flex-col items-center w-16">
      <img src="images/logo.png" alt="Logo" class="w-16 h-16 object-contain">
    </button>

    <button class="flex flex-col items-center w-14">
      <img src="images/memo.png" alt="Memo" class="w-12 h-12 object-contain">
      <span class="text-[12px] font-bold text-gray-600">Memo</span>
    </button>

    <button id="logoutBtn" class="flex flex-col items-center w-14">
      <img src="images/setting.png" alt="Setting" class="w-12 h-12 object-contain">
      <span class="text-[12px] font-bold text-gray-600">Setting</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
