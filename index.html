<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* キャラセットのコンテナ */
    .char-container { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    .char-item { position: absolute; display: flex; align-items: center; }
    .char-img { width: 120px; height: 120px; object-fit: contain; }
    .speech-bubble { width: 140px; height: auto; object-fit: contain; margin-left: -20px; }
  </style>
</head>
<body class="bg-cafe-pattern h-[100dvh] overflow-hidden">

  <div class="char-container">
    <div class="char-item top-10 right-4">
      <img src="images/waka.png" class="char-img">
      <img src="images/wakacom.png" class="speech-bubble">
    </div>
    <div class="char-item top-40 right-20">
      <img src="images/yuzu.png" class="char-img">
      <img src="images/yuzucom.png" class="speech-bubble">
    </div>
    <div class="char-item top-72 right-4">
      <img src="images/lily.png" class="char-img">
      <img src="images/lilycom.png" class="speech-bubble">
    </div>
    <div class="char-item top-[28rem] right-20">
      <img src="images/toru.png" class="char-img">
      <img src="images/torucom.png" class="speech-bubble">
    </div>
  </div>

  <cafe-nav></cafe-nav>

  <script src="components/navbar.js" defer></script>
</body>
</html>
