<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>☕ふらっとCafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script src="components/navbar.js" defer></script>
</head>
<body class="bg-amber-50 h-[100dvh] flex flex-col font-sans text-gray-800 overflow-hidden">
  
  <main id="home" class="flex-1 relative overflow-hidden flex flex-col justify-center items-center">
    <div class="absolute inset-0 bg-[#e6d5c3] z-0"></div>
    
    <div class="relative z-10 w-full max-w-md p-4 h-full flex flex-col justify-center">
      <div class="grid grid-cols-2 gap-y-8 gap-x-2">
        
        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-[#DFC6B0] px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">今日はお休み！</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">🌻</div>
        </div>

        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-[#DFC6B0] px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">日勤だから返信遅いかも！</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">🍃</div>
        </div>

        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-[#DFC6B0] px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">夜勤だよ～</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">🌸</div>
        </div>

        <div class="character opacity-0 flex flex-col items-center">
          <div class="speech-bubble bg-[#DFC6B0] px-2 py-1.5 text-xs font-bold shadow-md mb-2 text-center whitespace-nowrap">コラボ準備中！</div>
          <div class="text-5xl sm:text-7xl drop-shadow-lg filter transition-transform hover:scale-110">💎</div>
        </div>
        
      </div>
    </div>
  </main>

  <cafe-nav></cafe-nav>

  <script src="app.js"></script>
</body>
</html>
