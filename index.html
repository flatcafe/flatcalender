<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bg-cafe-home { background-image: url('images/back.png'); background-size: cover; background-position: center; }
    
    .char-container { position: relative; width: 100%; height: 85vh; display: flex; justify-content: center; align-items: center; }
    .char-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }

    /* --- 設定エリア --- */
    /* [大きさの数値はここ] */
    .char-img { width: 200px; height: 200px; object-fit: contain; }
    
    .speech-box { 
      width: 350px; height: 200px; 
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 30px; font-size: 22px; font-weight: bold;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      /* [回転の数値はここ] */
      transform-origin: center; 
      transition: transform 0.3s;
    }
    
    .rotate-20 { transform: rotate(20deg); }
    .rotate-minus-20 { transform: rotate(-20deg); }
  </style>
</head>
<body class="bg-cafe-home h-[100dvh] overflow-hidden">

  <div id="login-info" class="fixed top-4 right-4 z-40 bg-white/70 px-4 py-2 rounded-xl text-sm font-bold text-gray-700 shadow-sm cursor-pointer" onclick="document.getElementById('logout-modal').classList.remove('hidden')">
    <span id="display-user-name">ゲスト</span>でログイン中
  </div>

  <div id="logout-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-64 text-center">
      <p class="mb-6 font-bold text-gray-700">ログアウトしますか？</p>
      <div class="flex gap-4">
        <button id="cancel-logout" class="flex-1 py-2 bg-gray-100 rounded-lg text-gray-600 font-bold">キャンセル</button>
        <button id="confirm-logout" class="flex-1 py-2 bg-red-500 text-white rounded-lg font-bold">はい</button>
      </div>
    </div>
  </div>

  <div class="char-container">
    <div class="char-wrapper" style="top: 10%; left: 20%;" data-name="waka">
      <div class="speech-box bg-[url('images/wakacom.png')] rotate-20" contenteditable="true"></div>
      <img src="images/waka.png" class="char-img">
    </div>
    <div class="char-wrapper" style="top: 10%; right: 20%;" data-name="yuzu">
      <div class="speech-box bg-[url('images/yuzucom.png')] rotate-minus-20" contenteditable="true"></div>
      <img src="images/yuzu.png" class="char-img">
    </div>
    <div class="char-wrapper" style="bottom: 15%; left: 20%;" data-name="lily">
      <div class="speech-box bg-[url('images/lilycom.png')] rotate-20" contenteditable="true"></div>
      <img src="images/lily.png" class="char-img">
    </div>
    <div class="char-wrapper" style="bottom: 15%; right: 20%;" data-name="toru">
      <div class="speech-box bg-[url('images/torucom.png')] rotate-minus-20" contenteditable="true"></div>
      <img src="images/toru.png" class="char-img">
    </div>
  </div>

  <div class="fixed bottom-0 w-full z-50">
    <cafe-nav></cafe-nav>
  </div>
  
  <script src="components/navbar.js" defer></script>
  <script>
    // ユーザー名表示・ログアウト処理などはこれまで通り保持
    const userData = JSON.parse(localStorage.getItem('cafe_user'));
    if (userData && userData.name) document.getElementById('display-user-name').textContent = userData.name;

    document.getElementById('cancel-logout').addEventListener('click', () => document.getElementById('logout-modal').classList.add('hidden'));
    document.getElementById('confirm-logout').addEventListener('click', () => { localStorage.removeItem('cafe_user'); window.location.href = 'welcome.html'; });

    const shiftMessages = { "日勤": "お昼間はお仕事だよ", "休み": "お休みだー！！遊ぶぞ！！", "夜勤": "朝も昼もお仕事・・・", "明け": "明け！！やっとゲームできる！！", "当直": "当直だよ" };

    function updateBubbles() {
      const today = new Date();
      const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      const schedules = JSON.parse(localStorage.getItem('cafe_schedules')) || [];
      document.querySelectorAll('.char-wrapper').forEach(item => {
        const name = item.getAttribute('data-name');
        const bubble = item.querySelector('.speech-box');
        const todaySched = schedules.find(s => s.date === dateStr && s.characterName === name);
        bubble.textContent = todaySched ? (shiftMessages[todaySched.text] || todaySched.text) + (todaySched.detail?.trim() ? "☆" : "") : "今日は何の日？";
      });
    }
    updateBubbles();
  </script>
</body>
</html>
