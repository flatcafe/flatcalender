<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Home</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bg-cafe-home { background-image: url('images/back.png'); background-size: cover; background-position: center; }
    
    .char-container { position: relative; width: 100%; height: 85vh; }
    .char-item { position: absolute; display: flex; align-items: center; cursor: pointer; }
    
    /* キャラ：1.5倍 (元100px*1.5 = 150px) */
    .char-img { width: 150px; height: 150px; object-fit: contain; }
    
    /* 吹き出し：2.5倍 (元140*2.5=350px, 80*2.5=200px) */
    .speech-box { 
      width: 350px; height: 200px; 
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 30px; font-size: 22px; font-weight: bold;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      transition: transform 0.3s;
    }

    /* 回転設定 */
    .rotate-right { transform: rotate(20deg); }
    .rotate-left { transform: rotate(-20deg); }
  </style>
</head>
<body class="bg-cafe-home h-[100dvh] overflow-hidden">

  <div class="char-container">
    <div class="char-item top-5 right-4" data-name="waka">
      <div class="speech-box bg-[url('images/wakacom.png')] rotate-right" contenteditable="true"></div>
      <img src="images/waka.png" class="char-img">
    </div>

    <div class="char-item top-40 right-20" data-name="yuzu">
      <img src="images/yuzu.png" class="char-img">
      <div class="speech-box bg-[url('images/yuzucom.png')] rotate-left" contenteditable="true"></div>
    </div>

    <div class="char-item top-72 right-4" data-name="lily">
      <div class="speech-box bg-[url('images/lilycom.png')] rotate-right" contenteditable="true"></div>
      <img src="images/lily.png" class="char-img">
    </div>

    <div class="char-item top-[28rem] right-20" data-name="toru">
      <img src="images/toru.png" class="char-img">
      <div class="speech-box bg-[url('images/torucom.png')] rotate-left" contenteditable="true"></div>
    </div>
  </div>

  <cafe-nav></cafe-nav>
  <script src="components/navbar.js" defer></script>

  <script>
    const shiftMessages = {
      "日勤": "お昼間はお仕事だよ",
      "休み": "お休みだー！！遊ぶぞ！！",
      "夜勤": "朝も昼もお仕事・・・",
      "明け": "明け！！やっとゲームできる！！",
      "当直": "当直だよ"
    };

    function updateBubbles() {
      const today = new Date();
      const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      const schedules = JSON.parse(localStorage.getItem('cafe_schedules')) || [];

      document.querySelectorAll('.char-item').forEach(item => {
        const name = item.getAttribute('data-name');
        const bubble = item.querySelector('.speech-box');
        
        const todaySched = schedules.find(s => s.date === dateStr && s.characterName === name);
        
        if (todaySched) {
          let msg = shiftMessages[todaySched.text] || todaySched.text;
          if (todaySched.detail && todaySched.detail.trim() !== "") {
            msg += "☆";
          }
          bubble.textContent = msg;
        } else {
          bubble.textContent = "今日は何の日？";
        }
      });
    }
    updateBubbles();
  </script>
</body>
</html>
