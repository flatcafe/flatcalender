<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bg-cafe-home { background-image: url('images/back.png'); background-size: cover; background-position: center; }
    
    /* ログイン状態表示 */
    .login-status { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 8px; font-size: 12px; }

    /* 中央配置用コンテナ */
    .char-wrapper { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(2);
      display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10;
    }
  </style>
</head>
<body class="bg-cafe-home h-[100dvh] overflow-hidden">

  <div class="login-status">
    <span id="user-name">ゲスト</span>でログイン中
    <button onclick="logout()" class="ml-2 text-red-500 underline">ログアウト</button>
  </div>

  <div class="char-wrapper">
    <div class="flex items-center gap-4" data-name="waka">
      <div class="w-[140px] h-[80px] bg-[url('images/wakacom.png')] bg-contain bg-no-repeat" contenteditable="true"></div>
      <img src="images/waka.png" class="w-[100px] h-[100px]">
    </div>
    </div>

  <div class="fixed bottom-0 w-full z-50">
    <cafe-nav></cafe-nav>
  </div>
  
  <script src="components/navbar.js" defer></script>
  <script>
    function logout() {
      alert("ログアウトしました");
      // ログアウト処理をここに記述
    }
    // ユーザー名の取得処理などは別途実装
  </script>
</body>
</html>
