<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Setting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bg-cafe-home { background-image: url('images/back.png'); background-size: cover; background-position: center; }
  </style>
</head>
<body class="bg-cafe-home h-[100dvh] overflow-hidden flex flex-col">

  <div id="login-info" class="fixed top-4 right-4 z-40 bg-white/70 px-4 py-2 rounded-xl text-sm font-bold text-gray-700 shadow-sm cursor-pointer" onclick="document.getElementById('logout-modal').classList.remove('hidden')">
    <span id="display-user-name">ゲスト</span>でログイン中
  </div>

  <div id="logout-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-64 text-center">
      <p class="mb-6 font-bold text-gray-700">ログアウトしますか？</p>
      <div class="flex gap-4">
        <button id="cancel-logout" class="flex-1 py-2 bg-gray-100 rounded-lg text-gray-600 font-bold">キャンセル</button>
        <button id="confirm-logout" class="flex-1 py-2 bg-red-500 text-white rounded-lg font-bold">はい</button>
      </div>
    </div>
  </div>

  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-8">設定</h1>
    <div class="bg-white/80 p-6 rounded-2xl shadow-sm w-full max-w-sm">
      <p class="text-gray-600">ここから設定を変更できます。</p>
      </div>
  </main>

  <div class="fixed bottom-0 w-full z-50">
    <cafe-nav></cafe-nav>
  </div>
  
  <script src="components/navbar.js" defer></script>

  <script>
    // ユーザー名表示
    const userData = JSON.parse(localStorage.getItem('cafe_user'));
    if (userData && userData.name) {
      document.getElementById('display-user-name').textContent = userData.name;
    }

    // ログアウト処理
    document.getElementById('cancel-logout').addEventListener('click', () => {
      document.getElementById('logout-modal').classList.add('hidden');
    });
    document.getElementById('confirm-logout').addEventListener('click', () => {
      localStorage.removeItem('cafe_user');
      window.location.href = 'welcome.html';
    });
  </script>
</body>
</html>
