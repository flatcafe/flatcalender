<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ふらっとCafe">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Setting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bg-cafe-home { background-image: url('images/back.png'); background-size: cover; background-position: center; }
  </style>
  <script type="module" src="auth.js" defer></script>
</head>
<body class="bg-cafe-home h-[100dvh] overflow-hidden flex flex-col">

  <div id="login-info" class="fixed top-4 right-4 z-40 bg-white/70 px-4 py-2 rounded-xl text-sm font-bold text-gray-700 shadow-sm cursor-pointer" onclick="document.getElementById('logout-modal').classList.remove('hidden')">
    <span id="display-user-name">ゲスト</span>でログイン中
  </div>

  <div id="logout-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-64 text-center">
      <p class="mb-6 font-bold text-gray-700">ログアウトしますか？</p>
      <div class="flex gap-4">
        <button id="cancel-logout" class="flex-1 py-2 bg-gray-100 rounded-lg text-gray-600 font-bold">キャンセル</button>
        <button id="confirm-logout" class="flex-1 py-2 bg-red-500 text-white rounded-lg font-bold">はい</button>
      </div>
    </div>
  </div>

  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-8">設定</h1>
    <div class="bg-white/80 p-6 rounded-2xl shadow-sm w-full max-w-sm">

  <h2 class="font-bold text-lg mb-4">🔔 通知設定</h2>

  <label class="flex items-center justify-between py-3 border-b">
    <span>予定追加通知</span>
    <input type="checkbox" id="notify-add" checked>
  </label>

  <label class="flex items-center justify-between py-3 border-b">
    <span>予定編集通知</span>
    <input type="checkbox" id="notify-edit" checked>
  </label>

  <label class="flex items-center justify-between py-3 border-b">
    <span>吹き出し変更通知</span>
    <input type="checkbox" id="notify-bubble" checked>
  </label>

</div>
  </main>

  <div class="fixed bottom-0 w-full z-50">
    <cafe-nav></cafe-nav>
  </div>
  
  <script src="components/navbar.js" defer></script>

 <script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// ユーザー名表示
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  try {
    const userSnap = await getDoc(
      doc(db, "users", user.uid)
    );

    if (userSnap.exists()) {

  const data = userSnap.data();

  document.getElementById('display-user-name').textContent =
    data.name;

  document.getElementById('notify-add').checked =
    data.notifyAdd ?? true;

  document.getElementById('notify-edit').checked =
    data.notifyEdit ?? true;

  document.getElementById('notify-bubble').checked =
    data.notifyBubble ?? true;
}
  } catch (error) {
    console.error("ユーザー取得エラー:", error);
  }
  const saveNotificationSettings = async () => {

  console.log("保存開始");
  alert("保存処理実行");

  const user = auth.currentUser;
  if (!user) return;

  try {
    await updateDoc(
      doc(db, "users", user.uid),
      {
        notifyAdd: document.getElementById('notify-add').checked,
        notifyEdit: document.getElementById('notify-edit').checked,
        notifyBubble: document.getElementById('notify-bubble').checked
      }
    );
  } catch (error) {
    console.error("通知設定保存エラー:", error);
  }
};

document.getElementById('notify-add')
  .addEventListener('change', saveNotificationSettings);

document.getElementById('notify-edit')
  .addEventListener('change', saveNotificationSettings);

document.getElementById('notify-bubble')
  .addEventListener('change', saveNotificationSettings);
});

// ログアウト処理
document.getElementById('cancel-logout').addEventListener('click', () => {
  document.getElementById('logout-modal').classList.add('hidden');
});

document.getElementById('confirm-logout').addEventListener('click', async () => {
  try {
    await signOut(auth);
    window.location.href = 'welcome.html';
  } catch (error) {
    console.error("ログアウトエラー:", error);
  }
});
</script>
</body>
</html>
