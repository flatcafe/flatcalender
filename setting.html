<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ふらっとCafe - Setting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .bg-cafe-home { background-image: url('images/back.png'); background-size: cover; background-position: center; }
  </style>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ふらっとCafe">
  <link rel="apple-touch-icon" href="images/logo.png">

  <script type="module" src="auth.js" defer></script>
</head>
<body class="bg-cafe-home h-[100dvh] overflow-hidden flex flex-col">

  <div id="login-info" class="fixed top-4 right-4 z-40 bg-white/70 px-4 py-2 rounded-xl text-sm font-bold text-gray-700 shadow-sm cursor-pointer" onclick="document.getElementById('logout-modal').classList.remove('hidden')">
    <span id="display-user-name">ゲスト</span>でログイン中
  </div>

  <div id="logout-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-64 text-center">
      <p class="mb-6 font-bold text-gray-700">ログアウトしますか？</p>
      <div class="flex gap-4">
        <button id="cancel-logout" class="flex-1 py-2 bg-gray-100 rounded-lg text-gray-600 font-bold">キャンセル</button>
        <button id="confirm-logout" class="flex-1 py-2 bg-red-500 text-white rounded-lg font-bold">はい</button>
      </div>
    </div>
  </div>

  <main class="flex-1 flex flex-col items-center p-6 pb-24 overflow-y-auto mt-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">メンバーカラー設定</h1>
    <div class="bg-white/90 p-6 rounded-2xl shadow-sm w-full max-w-sm">
      <p class="text-gray-600 mb-6 text-sm leading-relaxed">カレンダーで表示される各メンバーのメインカラーと、<span class="font-bold text-red-500">「休み」「明け」用のサブカラー</span>を設定・保存します。</p>
      
      <div id="color-forms" class="flex flex-col gap-5">
        <div class="flex items-center justify-between border-b border-gray-200 pb-3">
          <div class="font-bold text-[#abc888]">若凪 (waka)</div>
          <div class="flex gap-4">
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">メイン<input type="color" id="waka-main" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">サブ<input type="color" id="waka-sub" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
          </div>
        </div>
        <div class="flex items-center justify-between border-b border-gray-200 pb-3">
          <div class="font-bold text-[#e0d346]">柚茶 (yuzu)</div>
          <div class="flex gap-4">
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">メイン<input type="color" id="yuzu-main" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">サブ<input type="color" id="yuzu-sub" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
          </div>
        </div>
        <div class="flex items-center justify-between border-b border-gray-200 pb-3">
          <div class="font-bold text-[#F0566E]">Lily00 (lily)</div>
          <div class="flex gap-4">
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">メイン<input type="color" id="lily-main" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">サブ<input type="color" id="lily-sub" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
          </div>
        </div>
        <div class="flex items-center justify-between pb-1">
          <div class="font-bold text-[#968ABD]">とるま (toru)</div>
          <div class="flex gap-4">
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">メイン<input type="color" id="toru-main" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
            <label class="flex flex-col items-center text-xs text-gray-500 font-bold">サブ<input type="color" id="toru-sub" class="w-8 h-8 mt-1 cursor-pointer border-none"></label>
          </div>
        </div>
      </div>

      <button id="save-colors-btn" class="w-full mt-8 bg-amber-600 text-white py-3 rounded-xl font-bold shadow-sm active:scale-95 transition hover:bg-amber-700">設定を保存する</button>
    </div>
  </main>

  <div class="fixed bottom-0 w-full z-50">
    <cafe-nav></cafe-nav>
  </div>
  
  <script src="components/navbar.js" defer></script>
  <script type="module" src="setting.js" defer></script>
</body>
</html>
