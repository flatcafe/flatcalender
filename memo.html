<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memo</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background-image: url('images/back.png');
  background-size: cover;
  background-position: center;
}
</style>

</head>

<body class="min-h-screen overflow-hidden">


<div class="p-6">

<div class="flex justify-between items-center">

<h1 class="text-3xl font-bold text-[#5a4a42]">
📝 メモ
</h1>

<button id="notification-btn"
  class="relative text-3xl">

  🔔

  <span id="notification-badge"
    class="absolute -top-1 -right-2 bg-red-500 text-white text-xs rounded-full px-1.5 hidden">
    0
  </span>

</button>

</div>

<div class="mt-8 bg-white/80 rounded-2xl p-6 shadow">
<p class="text-[#5a4a42]">
メモ機能準備中です☕
</p>
</div>

</div>

<div id="notification-panel"
  class="hidden fixed top-20 right-4 w-72 bg-white rounded-2xl shadow-xl p-4 z-50">

  <h2 class="font-bold mb-3">
    ☕ おしらせ
  </h2>

  <div id="notification-list">
    通知はありません
  </div>

</div>
  
<!-- メニューバー -->
<div class="fixed bottom-0 w-full z-50 pointer-events-none">
  <div class="pointer-events-auto">
    <cafe-nav></cafe-nav>
  </div>
</div>

<script>

const badge =
  document.getElementById('notification-badge');

badge.textContent = '3';
badge.classList.remove('hidden');

const panel =
  document.getElementById('notification-panel');

document
  .getElementById('notification-btn')
  .addEventListener('click', () => {

    panel.classList.toggle('hidden');

  });

</script>

  <script type="module">

import { db } from './firebase-config.js';

import {
  collection,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const notificationList =
  document.getElementById('notification-list');

const q = query(
  collection(db, "notifications"),
  orderBy("createdAt", "desc"),
  limit(10)
);

onSnapshot(q, (snapshot) => {

  let html = '';

  snapshot.forEach((doc) => {

    const data = doc.data();

    const icon =
      data.type === 'edit'
        ? '📝'
        : '☕';

    html += `
      <div class="border-b py-2">
        ${icon} ${data.title}
      </div>
    `;
  });

  notificationList.innerHTML =
    html || '通知はありません';

});

</script>
  
<script src="components/navbar.js" defer></script>


</body>
</html>
