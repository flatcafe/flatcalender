<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memo</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background-image: url('images/back.png');
  background-size: cover;
  background-position: center;
}
</style>

</head>

<body class="min-h-screen overflow-hidden">


<div class="p-6">

<div class="flex justify-between items-center">

<h1 class="text-3xl font-bold text-[#5a4a42]">
📝 メモ
</h1>

<button id="notification-btn"
  class="relative text-3xl">

  🔔

  <span id="notification-badge"
    class="absolute -top-1 -right-2 bg-red-500 text-white text-xs rounded-full px-1.5 hidden">
    0
  </span>

</button>

</div>

  <div class="mt-8 space-y-4">

  <div class="bg-white/80 rounded-2xl shadow">

<button id="plannedToggle"
  class="w-full flex justify-between items-center p-4 font-bold text-[#5a4a42]">
  <span id="plannedTitle">▼ 仮予定（0）</span>
</button>

<div id="plannedContent" class="p-4 border-t">

 <button
  id="addPlannedBtn"
  class="w-full rounded-xl bg-amber-100 py-2 font-bold text-[#5a4a42]">
  ＋ 新規作成
</button>

  <div id="plannedList" class="mt-3 space-y-2"></div>

</div>

  </div>


 <div class="bg-white/80 rounded-2xl shadow">

<button id="confirmedToggle"
  class="w-full flex justify-between items-center p-4 font-bold text-[#5a4a42]">
    <span id="confirmedTitle">▼ 確定済（0）</span>
  </button>

  <div id="confirmedContent" class="p-4 border-t">

    <button
      id="addConfirmedBtn"
      class="w-full rounded-xl bg-amber-100 py-2 font-bold text-[#5a4a42]">
      ＋ 新規作成
    </button>

    <div id="confirmedList" class="mt-3 space-y-2"></div>

  </div>

</div>


<div class="bg-white/80 rounded-2xl shadow">

  <button id="doneToggle"
    class="w-full flex justify-between items-center p-4 font-bold text-[#5a4a42]">
    <span id="doneTitle">▼ 済（0）</span>
  </button>

  <div id="doneContent" class="p-4 border-t">

    <div id="doneList" class="mt-3 space-y-2"></div>

  </div>

</div>
    </div>

  </div>

</div>

</div>

<div id="notification-panel"
  class="hidden fixed top-20 right-4 w-72 bg-white rounded-2xl shadow-xl p-4 z-50">

  <h2 class="font-bold mb-3">
    ☕ おしらせ
  </h2>

  <div id="notification-list">
    通知はありません
  </div>

</div>
  
<div class="fixed bottom-0 w-full z-50 pointer-events-none">
  <div class="pointer-events-auto">
    <cafe-nav></cafe-nav>
  </div>
</div>

  <div id="detailModal"
  class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">

  <div class="bg-white rounded-2xl w-[90%] max-w-md p-5">

   <input
  id="editTitle"
  class="w-full border rounded-xl p-2 font-bold"
  placeholder="タイトル">

<!-- 日付と時間を選択できる入力欄に変更（type="datetime-local" に変更） -->
<input
  id="editDate"
  type="datetime-local"
  class="w-full border rounded-xl p-2 mt-3 text-gray-700">

<!-- 「未定」にするためのチェックボックスをすぐ下に追加 -->
<div class="flex items-center gap-2 mt-2 px-1">
  <input type="checkbox" id="editDateUndecided" class="w-4 h-4 accent-amber-500">
  <label for="editDateUndecided" class="text-sm text-gray-600 font-bold cursor-pointer">日時は未定にする</label>
</div>
<select
  id="editCategory"
  class="w-full border rounded-xl p-2 mt-3">

  <option value="">カテゴリー選択</option>
  <option>配信</option>
  <option>コラボ</option>
  <option>イベントのお誘い</option>
  <option>裏遊び</option>

</select>

<textarea
  id="editMemo"
  class="w-full border rounded-xl p-2 mt-3 h-32"
  placeholder="メモ"></textarea>
    
<button
  id="editPlanBtn"
  class="mb-2 w-full rounded-xl bg-sky-100 py-2 font-bold">
  編集
</button>

<button
  id="confirmPlanBtn"
  class="mb-2 w-full rounded-xl bg-green-200 py-2 font-bold">
  確定にする
</button>
    
    <button
  id="deletePlanBtn"
  class="mb-2 w-full rounded-xl bg-red-100 py-2 font-bold text-red-600">
  削除
</button>
    
    <button id="closeDetailBtn"
      class="mt-6 w-full rounded-xl bg-amber-100 py-2 font-bold">
      閉じる
    </button>

  </div>

</div>

  <script type="module">

import { db, auth } from './firebase-config.js';

import {
  collection,
  query,
  orderBy,
  limit,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  arrayUnion,
  getDoc,
  addDoc,
  serverTimestamp,
  where
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    
const badge =
  document.getElementById('notification-badge');

const panel =
  document.getElementById('notification-panel');

const notificationBtn =
  document.getElementById('notification-btn');

const notificationList =
  document.getElementById('notification-list');

const addPlannedBtn =
  document.getElementById("addPlannedBtn");

  const detailModal =
  document.getElementById("detailModal");

const detailTitle =
  document.getElementById("detailTitle");

const detailDate =
  document.getElementById("detailDate");

const closeDetailBtn =
  document.getElementById("closeDetailBtn");

    const editPlanBtn =
  document.getElementById("editPlanBtn");

    const confirmPlanBtn =
  document.getElementById("confirmPlanBtn");

  const detailCategory =
  document.getElementById("detailCategory");

const detailMemo =
  document.getElementById("detailMemo");

    const editTitle =
  document.getElementById("editTitle");

const editDate =
  document.getElementById("editDate");

const editCategory =
  document.getElementById("editCategory");

const editMemo =
  document.getElementById("editMemo");

let currentPlanId = null;
    
closeDetailBtn.addEventListener("click", () => {
  detailModal.classList.add("hidden");
});
    
let notificationIds = [];

const q = query(
  collection(db, "notifications"),
  orderBy("createdAt", "desc"),
  limit(10)
);

onSnapshot(q, async (snapshot) => {

  notificationIds = [];

  let html = '';
  let count = 0;

 for (const docSnap of snapshot.docs) {

    const notificationId = docSnap.id;
    notificationIds.push(notificationId);

    const user = auth.currentUser;
   const data = docSnap.data();


// 自分の通知は出さない
/*
if(
  user &&
  data.authorUid &&
  data.authorUid === user.uid
){
  return;
}
*/
// 通知設定チェック
if(user){

  const userSnap = await getDoc(
    doc(db,"users",user.uid)
  );

  if(userSnap.exists()){

    const setting = userSnap.data();

    if(data.type === "add" && setting.notifyAdd === false){
      continue;
    }

    if(data.type === "edit" && setting.notifyEdit === false){
      continue;
    }

    if(data.type === "bubble" && setting.notifyBubble === false){
      continue;
    }

  }

}

    const author = data.author || 'だれか';

    let icon = '☕';
    let message = data.title;

    if (data.type === 'add') {
      icon = '☕';
      message =
        `${author}さんが「${data.title}」を追加しました`;
    }

    if (data.type === 'edit') {
      icon = '📝';
      message =
        `${author}さんが「${data.title}」を編集しました`;
    }

    if (data.type === 'bubble') {
      icon = '💬';
      message =
        `${author}さんが吹き出しを変更しました`;
    }

  const charName = data.characterName;
  const authorIcon = charName ? `images/icons/${charName}.png` : (data.authorIcon || data.icon || '');
   
html += `
  <div class="border-b py-2 flex items-center gap-2">

    ${
      authorIcon
      ? `<img src="${authorIcon}" class="w-8 h-8 rounded-full">`
      : ''
    }

    <div>
      ${icon} ${message}
    </div>

  </div>
`;


const isRead =
  user &&
  data.readBy &&
  data.readBy.includes(user.uid);

const isMyPost = 
  user && 
  data.authorUid && 
  data.authorUid === user.uid;


if (!isRead && !isMyPost) {
  count++;
}

}
  
  
  notificationList.innerHTML =
    html || '通知はありません';

  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }

});
    
 notificationBtn.addEventListener('click', async () => {

  panel.classList.toggle('hidden');

  badge.classList.add('hidden');

  const user = auth.currentUser;

  if (!user) return;

  for (const id of notificationIds) {

    await updateDoc(
      doc(db, "notifications", id),
      {
        readBy: arrayUnion(user.uid)
      }
    );

  }
});

    function setupAccordion(toggleId, titleId, contentId, text) {

  const toggle = document.getElementById(toggleId);
  const title = document.getElementById(titleId);
  const content = document.getElementById(contentId);

  let opened = true;

  toggle.addEventListener("click", () => {

    opened = !opened;

    content.classList.toggle("hidden", !opened);

    title.textContent =
      `${opened ? "▼" : "▶"} ${text}`;

  });

}

    const plannedList = document.getElementById("plannedList");

    const confirmedList = document.getElementById("confirmedList");

const plansQuery = query(
  collection(db, "plans"),
  where("status", "==", "planned"),
  orderBy("createdAt", "desc")
);

onSnapshot(plansQuery, (snapshot) => {

  plannedList.innerHTML = "";

document.getElementById("plannedTitle").textContent =
  `▼ 仮予定（${snapshot.size}）`;

snapshot.forEach((docSnap) => {

  const plan = docSnap.data();

  const div = document.createElement("div");

  div.className =
    "bg-white rounded-xl p-3 shadow cursor-pointer";

 div.innerHTML = `
  <div class="text-xs text-gray-500">
    📅 ${plan.date || "未定"}
  </div>

  <div class="font-bold text-[#5a4a42] mt-1">
    ${plan.title}
  </div>
`;

 div.addEventListener("click", () => {

   currentPlanId = docSnap.id;

editTitle.value = plan.title || "";

editCategory.value = plan.category || "";

editMemo.value = plan.memo || "";

// ★予定データが開かれたときの「未定」チェック状態の連動処理
const isUndecided = !plan.date || plan.date === "未定";
document.getElementById("editDateUndecided").checked = isUndecided;
editDate.disabled = isUndecided;
if (!isUndecided) {
  // 保存されている「YYYY/MM/DD HH:mm」を input(datetime-local)で使える形式に復元してセット
  editDate.value = plan.date.replace(/ /g, "T").replace(/\//g, "-");
} else {
  editDate.value = "";
}

   // （仮予定を開いたのでボタンを「確定にする」にする）
confirmPlanBtn.textContent = "確定にする";

detailModal.classList.remove("hidden");
// 
   
  detailModal.classList.remove("hidden");

});
  plannedList.appendChild(div);
});

});

    const confirmedQuery = query(
  collection(db, "plans"),
  where("status", "==", "confirmed"),
  orderBy("createdAt", "desc")
);

onSnapshot(confirmedQuery, (snapshot) => {

  confirmedList.innerHTML = "";

  document.getElementById("confirmedTitle").textContent =
    `▼ 確定済（${snapshot.size}）`;

  snapshot.forEach((docSnap) => {

    const plan = docSnap.data();

    const div = document.createElement("div");

    div.className =
      "bg-white rounded-xl p-3 shadow cursor-pointer";

    div.innerHTML = `
      <div class="text-xs text-gray-500">
        📅 ${plan.date || "未定"}
      </div>

      <div class="font-bold text-[#5a4a42] mt-1">
        ${plan.title}
      </div>
    `;

    div.addEventListener("click", () => {

  currentPlanId = docSnap.id;

  editTitle.value = plan.title || "";
  editCategory.value = plan.category || "";
  editMemo.value = plan.memo || "";

  // ★予定データが開かれたときの「未定」チェック状態の連動処理
  const isUndecided = !plan.date || plan.date === "未定";
  document.getElementById("editDateUndecided").checked = isUndecided;
  editDate.disabled = isUndecided;
  if (!isUndecided) {
    editDate.value = plan.date.replace(/ /g, "T").replace(/\//g, "-");
  } else {
    editDate.value = "";
  }

      //（確定済を開いたのでボタンを「済にする」にする）
confirmPlanBtn.textContent = "済にする";

detailModal.classList.remove("hidden");
// （略）

  detailModal.classList.remove("hidden");

});

    confirmedList.appendChild(div);

  });

});

    // --- 済（done）のデータをFirestoreから取得して表示する処理を追加 ---
const doneList = document.getElementById("doneList");

const doneQuery = query(
  collection(db, "plans"),
  where("status", "==", "done"),
  orderBy("createdAt", "desc")
);

onSnapshot(doneQuery, (snapshot) => {
  doneList.innerHTML = "";

  document.getElementById("doneTitle").textContent =
    `▼ 済（${snapshot.size}）`;

  snapshot.forEach((docSnap) => {
    const plan = docSnap.data();
    const div = document.createElement("div");

    div.className =
      "bg-white rounded-xl p-3 shadow cursor-pointer opacity-70"; // 済なので少し薄く表示

    div.innerHTML = `
      <div class="text-xs text-gray-500">
        📅 ${plan.date || "未定"}
      </div>
      <div class="font-bold text-[#5a4a42] mt-1 line-through">
        ${plan.title}
      </div>
    `;

    div.addEventListener("click", () => {
      currentPlanId = docSnap.id;

      editTitle.value = plan.title || "";
      editCategory.value = plan.category || "";
      editMemo.value = plan.memo || "";

      // ★予定データが開かれたときの「未定」チェック状態の連動処理
      const isUndecided = !plan.date || plan.date === "未定";
      document.getElementById("editDateUndecided").checked = isUndecided;
      editDate.disabled = isUndecided;
      if (!isUndecided) {
        editDate.value = plan.date.replace(/ /g, "T").replace(/\//g, "-");
      } else {
        editDate.value = "";
      }

      // 済の予定を開いたときは、確定ボタンを非表示にするか、テキストを変更する
      confirmPlanBtn.textContent = "完了済"; 

      detailModal.classList.remove("hidden");
    });

    doneList.appendChild(div);
  });
});
    
setupAccordion(
  "plannedToggle",
  "plannedTitle",
  "plannedContent",
  "仮予定（0）"
);

setupAccordion(
  "confirmedToggle",
  "confirmedTitle",
  "confirmedContent",
  "確定済（0）"
);

setupAccordion(
  "doneToggle",
  "doneTitle",
  "doneContent",
  "済（0）"
);

// --- 「＋ 新規作成」ボタンを押したときの処理 ---
addPlannedBtn.addEventListener("click", () => {
  // 1. 新規作成なので、前のデータが残らないように入力欄を空にする
  currentPlanId = null; // 新規作成であることを表すために ID を null に
  editTitle.value = "";
  editDate.value = "";
  editCategory.value = "";
  editMemo.value = "";

  // ★チェックボックスを初期状態（OFF ＝ 未定にしない）に設定
  document.getElementById("editDateUndecided").checked = false;
  editDate.disabled = false;

  // 2. ボタンのテキストを「作成する」に変更する
  confirmPlanBtn.textContent = "作成する";

  // 3. 入力画面（モーダル）を表示する
  detailModal.classList.remove("hidden");
});

// --- 修正箇所 2: モーダル内の「編集」ボタン（editPlanBtn）で既存ドキュメントを更新する ---
editPlanBtn.addEventListener("click", async () => {
  if (!currentPlanId) return;

  const title = editTitle.value;
  const category = editCategory.value;
  const memo = editMemo.value;

  // ★ここを書き換え：上と同じように未定チェックの状態を見て日時を取得する
  const isUndecided = document.getElementById("editDateUndecided").checked;
  let date = "未定";
  if (!isUndecided && editDate.value) {
    date = editDate.value.replace("T", " ").replace(/-/g, "/");
  }

  await updateDoc(doc(db, "plans", currentPlanId), {
    title,
    date,
    category,
    memo
  });

  detailModal.classList.add("hidden");
});

// --- モーダル内の「作成 / 確定 / 済」ボタン（confirmPlanBtn）の処理 ---
confirmPlanBtn.addEventListener("click", async () => {
  const title = editTitle.value || "無題の予定";
  const category = editCategory.value || "";
  const memo = editMemo.value || "";

  // ★ここを書き換え：未定チェックボックスがONなら「未定」にし、OFFなら選択した日時を「YYYY/MM/DD HH:mm」形式に変換する
  const isUndecided = document.getElementById("editDateUndecided").checked;
  let date = "未定";
  if (!isUndecided && editDate.value) {
    // datetime-localの値（YYYY-MM-DDTHH:mm）を「YYYY/MM/DD HH:mm」に読みやすく変換
    date = editDate.value.replace("T", " ").replace(/-/g, "/");
  }
  // A. 新規作成の場合（ID が null のとき）
  if (!currentPlanId) {
    await addDoc(collection(db, "plans"), {
      title,
      date,
      category,
      status: "planned", // 最初は仮予定として追加
      memo,
      createdAt: serverTimestamp()
    });
  } 
  // B. すでに存在する予定のステータスを更新する場合
  else {
    const planDoc = await getDoc(doc(db, "plans", currentPlanId));
    if (!planDoc.exists()) return;

    const currentStatus = planDoc.data().status;
    let nextStatus = "confirmed";

    if (currentStatus === "confirmed") {
      nextStatus = "done";
    }

    await updateDoc(doc(db, "plans", currentPlanId), {
      status: nextStatus
    });
  }

  // フォームをクリアしてモーダルを閉じる
  editTitle.value = "";
  editDate.value = "";
  editCategory.value = "";
  editMemo.value = "";
  detailModal.classList.add("hidden");
});
    
deletePlanBtn.addEventListener("click", async () => {

  if (!currentPlanId) return;

  if (!confirm("この予定を削除しますか？")) return;

  await deleteDoc(doc(db, "plans", currentPlanId));

  detailModal.classList.add("hidden");

});

// ★「日時は未定にする」チェックボックスをクリックしたとき、日時入力欄を自動で使えなく（グレーアウト）する機能
document.getElementById("editDateUndecided").addEventListener("change", (e) => {
  const editDateInput = document.getElementById("editDate");
  editDateInput.disabled = e.target.checked;
  if (e.target.checked) {
    editDateInput.value = ""; // 「未定」にチェックが入ったら日付の数値をリセット
  }
});
  
</script>
  
<script src="components/navbar.js" defer></script>


</body>
</html>
