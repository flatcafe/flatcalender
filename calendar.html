<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>☕ふらっとCafe - カレンダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script src="components/navbar.js" defer></script>
</head>
<body class="bg-cafe-pattern h-[100dvh] flex flex-col font-sans text-gray-800 overflow-hidden">
  
  <main class="flex-1 relative flex flex-col items-center w-full pb-safe">
    
    <div class="w-full px-4 pt-6 pb-2 flex justify-between items-end text-black z-10">
      <h2 id="month-display" class="text-2xl font-bold tracking-wider leading-none">June 2026</h2>
      <div class="flex gap-6 text-xl font-bold">
        <button id="prev-month" class="px-2 hover:scale-125 transition">&lt;</button>
        <button id="next-month" class="px-2 hover:scale-125 transition">&gt;</button>
      </div>
    </div>

    <div class="w-full grid grid-cols-7 text-center text-sm font-bold z-10 mb-1">
      <div class="text-black">Mon</div>
      <div class="text-black">Tue</div>
      <div class="text-black">Wed</div>
      <div class="text-black">Thu</div>
      <div class="text-black">Fri</div>
      <div class="text-blue-700">Sat</div>
      <div class="text-red-700">Sun</div>
    </div>

    <div class="w-full flex-1 bg-white/20 border-t border-black flex flex-col z-10">
      <div id="calendar-days" class="w-full h-full grid grid-cols-7 border-l border-black">
        </div>
    </div>
  </main>

  <cafe-nav></cafe-nav>

  <script src="calendar.js"></script>
</body>
</html>
